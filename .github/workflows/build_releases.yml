name: Build Standalone Executables (Windows & macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64 EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Download FFmpeg for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "ffmpeg.exe"

      - name: Build with PyInstaller
        run: |
          pyinstaller press_sub.spec --clean -y

      - name: Package Dist Folder with FFmpeg
        shell: pwsh
        run: |
          Copy-Item -Path "ffmpeg.exe" -Destination "dist\ffmpeg.exe"
          Compress-Archive -Path "dist\*" -DestinationPath "短剧字幕批量压制工具_Windows_x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 短剧字幕批量压制工具_Windows_x64
          path: 短剧字幕批量压制工具_Windows_x64.zip

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller press_sub.spec --clean -y

      - name: Package macOS Binary
        run: |
          cd dist
          zip -9 ../短剧字幕批量压制工具_macOS_arm64.zip 短剧字幕批量压制工具

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 短剧字幕批量压制工具_macOS_arm64
          path: 短剧字幕批量压制工具_macOS_arm64.zip
